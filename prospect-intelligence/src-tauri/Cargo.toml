[package]
name = "itarchitechs-prospect-intelligence"
version = "0.1.0"
edition = "2021"
description = "IT Architechs Prospect Intelligence"
authors = ["IT Architechs"]

[lib]
name = "pi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
pi-core = { path = "../crates/pi-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
