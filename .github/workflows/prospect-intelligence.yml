name: prospect-intelligence-build
on:
  push:
    paths: ["prospect-intelligence/**", ".github/workflows/prospect-intelligence.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: prospect-intelligence
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p pi-core
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            prospect-intelligence/target/release/bundle/nsis/*.exe
            prospect-intelligence/target/release/bundle/msi/*.msi
